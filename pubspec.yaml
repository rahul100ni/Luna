name: luna_app
description: Luna — Your Cycle Companion

publish_to: 'none'
version: 1.1.25+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  sqflite: ^2.3.3
  path: ^1.9.0

  # HTTP (DeepSeek API)
  http: ^1.2.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Animations
  flutter_animate: ^4.5.0

  # UI & Charts

  fl_chart: ^0.68.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  # Version Manager (APK download + install — uses Firebase REST, no SDK needed)
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
