    <text x="112" y="140" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#F2BE9B">DAYS 17 – 22</text>
    <text x="112" y="175" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#E8BCA0">Cozy &amp; detail-focused</text>
    <text x="112" y="196" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" fill="#BA8D72">Progesterone &amp; GABA</text>
    <text x="112" y="215" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" fill="#BA8D72">Metabolic burn +200 kcal</text>
    <rect x="35" y="235" width="155" height="4" rx="2" fill="#E8A87C"/>
