  <!-- Card 5: Late Luteal (PMS) -->
  <g transform="translate(970, 15)" filter="url(#cardShadow)">
    <rect width="225" height="260" rx="20" fill="#1C1628" stroke="#9B84D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="112" cy="55" r="28" fill="#9B84D4" fill-opacity="0.2"/>
    <text x="112" y="63" text-anchor="middle" font-size="24">🌙</text>
    <text x="112" y="112" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#F3EEFB">Late Luteal</text>
