    <text x="112" y="140" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C2B2EA">DAYS 23 – 28+</text>
    <text x="112" y="175" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#C5B6E8">Radical gentleness</text>
    <text x="112" y="196" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" fill="#9884BD">Hormone reset drop</text>
    <text x="112" y="215" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" fill="#9884BD">Amygdala sensitivity</text>
    <rect x="35" y="235" width="155" height="4" rx="2" fill="#9B84D4"/>
  </g>
</svg>
