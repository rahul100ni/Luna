name: Release Luna APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Luna-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Luna-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Luna-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Luna-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/Luna-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Luna ${{ github.ref_name }} — The Science-First Cycle Intelligence Companion
          files: release-assets/*.apk
          generate_release_notes: false
          body: |
            ## 🌙 Luna ${{ github.ref_name }} — Official Production Release

            Welcome to the official **Luna ${{ github.ref_name }}** production release — an offline-first, private cycle intelligence companion certified under package ID `app.vakya.luna`.

            ### 📦 Packages Included
            - **`Luna-v1.0.0.apk`** *(Recommended)*: Optimized for all modern 64-bit Android smartphones (~9.5 MB).
            - **`Luna-arm64-v8a.apk`**: Identical to primary ARM64 package.
            - **`Luna-universal.apk`**: Compatible with all Android architectures (~26 MB).
            - **`Luna-armeabi-v7a.apk`**: Compatible with legacy 32-bit Android devices (~9.0 MB).
            - **`Luna-x86_64.apk`**: Optimized for Android emulators and Chromebooks (~9.7 MB).

            ### ✨ What's New in This Release
            - **🛡️ Play Protect Developer Registration**: Official package namespace `app.vakya.luna` configured for Google Play Developer Console certification and seamless APK installs without Play Protect warnings.
            - **🧠 Longitudinal Pattern Recognition**: Strict 7-log calibration baseline before discovering personal hormonal rhythms (Late-Luteal Energy Trough, Estrogen Acceleration, Premenstrual Sensitivity, Prostaglandin Curves, Craving Waves). Zero fake patterns.
            - **📊 Progressive Disclosure Insights**: Visual hierarchy prioritizing daily signals (Today's Pulse, 7-Day Energy, Mood Climate) with expandable `Hormonal breakdown ▾` cards.
            - **🩸 Context-Aware Period Logging**: Intelligent Day 1 detection in Check-in and Calendar screens that eliminates redundant or stuck "Period started" buttons.
            - **⚡ Adult 1–5 Energy Slider**: Direct, fluid energy level recording with descriptive states (*Drained*, *Low*, *Balanced*, *High*, *Peak*).
            - **🤖 Discreet Multi-Device Telemetry**: Background asynchronous token consumption tracking to Firebase RTDB with secret 5-tap Admin Panel in the Version Manager.
            - **📱 Android 11+ Compatibility**: `<queries>` package visibility declared, mandatory notification channels initialized, and safe exact/inexact alarm handling.
            - **🔒 100% Private & Offline-First**: Sensitive cycle logs, notes, and profile stay strictly inside your encrypted on-device SQLite database.
