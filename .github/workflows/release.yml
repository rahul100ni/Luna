name: Release Luna APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs
        run: flutter build apk --split-per-abi

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Luna-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Luna-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Luna-armeabi-v7a.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
          name: Luna ${{ github.ref_name }}
          body: |
            ## 🌙 Luna ${{ github.ref_name }}

            Welcome to the official release of **Luna** — the science-first, offline-private cycle intelligence companion.

            ### 📦 Packages Included
            - **`Luna-arm64-v8a.apk`** *(Recommended)*: Optimized for modern 64-bit Android smartphones.
            - **`Luna-universal.apk`**: Compatible with all Android architectures.
            - **`Luna-armeabi-v7a.apk`**: Compatible with legacy 32-bit Android devices.

            ### ✨ Highlights
            - Adaptive 5-phase living theme engine
            - 28-day individual biological intelligence
            - Craving-adaptive smart nutrition sync (Veg / Eggetarian / Non-Veg)
            - Continuous period flow banding & calendar rhythm
            - Clinical AI companion with offline fallbacks
            - 100% on-device SQLite database with zero telemetry
