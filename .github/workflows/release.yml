name: Release Luna APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Luna-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Luna-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Luna-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Luna-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/Luna-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Luna ${{ github.ref_name }}: The Science-First Cycle Intelligence Companion
          files: release-assets/*.apk
          generate_release_notes: false
          body: |
            ## 🌙 Luna ${{ github.ref_name }}: Official Production Release

            Welcome to the official **Luna ${{ github.ref_name }}** production release: an offline-first, private cycle intelligence companion certified under package ID `app.vakya.luna`.

            ### 📦 Packages Included
            - **`Luna-${{ github.ref_name }}.apk`** *(Recommended)*: Optimized for all modern 64-bit Android smartphones (~9.1 MB).
            - **`Luna-arm64-v8a.apk`**: Identical to primary ARM64 package.
            - **`Luna-universal.apk`**: Compatible with all Android architectures (~26 MB).
            - **`Luna-armeabi-v7a.apk`**: Compatible with legacy 32-bit Android devices (~8.7 MB).
            - **`Luna-x86_64.apk`**: Optimized for Android emulators and Chromebooks (~9.3 MB).

            ### ✨ What's New in This Release
            - **🩸 Multi-Cycle Gap Analysis & Endocrinological Intelligence**: Full multi-cycle historical gap tracking (e.g. Aug 22 to Sep 20 = 29-day cycle). Informs AI and Home screens with root biological causes (follicular/luteal phase dynamics) instead of generic advice.
            - **🔄 Dynamic Period Length Calibration**: When the user enters an unknown period length during onboarding, Luna intelligently observes consecutive bleeding days and dynamically self-calibrates without nagging or guessing.
            - **✨ Human-Centered Collapsible Auto-Logging**: Subtle, respectful 34px check-in capsules and 22px micro-badges in chat. Deduplicates symptoms, normalizes formatting, and keeps logging discreet rather than clinical or overwhelming.
            - **💜 Vision Pillar One Intimate Memory**: Deep companion memory engine stores meaningful personal context and seamlessly surfaces it in both check-in and conversational AI interactions.
            - **🛡️ Rock-Solid Robustness**: Zero-cycle state protection, null-safe biomarker logging, and permanent cryptographic keystore signature.
